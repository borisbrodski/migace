name: Build

# Build, lint and tests on every push to candidate and to feature branches,
# on Linux, Windows and macOS. No step needs Docker.

on:
  push:
    branches-ignore: [main]
  schedule:
    # Every night: the oldest supported PostgreSQL version.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      # For the Java runner in clients/java. It is compiled for Java 11; the build runs on a newer JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      # The test steps run although an earlier one failed, so that one run shows every problem of a platform.
      - run: npm test
        if: ${{ !cancelled() }}
      # Fails when the coverage of the TypeScript sources falls below the limits in vitest.coverage.config.ts.
      # The limits of the Java runner are part of "npm test": Gradle checks them in clients/java.
      - run: npm run test:coverage
        if: ${{ !cancelled() }}
      # The tests that start a real PostgreSQL server from the package of binaries.
      - run: npm run test:server
        if: ${{ !cancelled() }}
      # The expected files in the repository must be what the generators produce now.
      - run: npm run test:generate
      - name: The generate run changed no file
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            exit 1
          fi

  oldest-postgresql:
    # The server tests on the oldest PostgreSQL version that is still supported. The newest one runs on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:server
        env:
          MIGACE_POSTGRESQL_BINARIES: ${{ github.workspace }}/node_modules/embedded-postgres-15-linux-x64/native
